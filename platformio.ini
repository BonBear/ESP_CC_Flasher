
[platformio]
#core_dir = core

[common]
lib_deps =
    me-no-dev/ESPAsyncWebServer
    https://github.com/tzapu/WiFiManager.git#feature_asyncwebserver
    WiFiClientSecure

[env:esp32doit-devkit-v1]
platform = espressif32@6.13.0  ; pinned: newer platforms ship mbedTLS 3 (no _ret functions for the web auth patch)
board = esp32doit-devkit-v1
framework = arduino
upload_speed = 921600
upload_port = COM6
monitor_speed = 115200
monitor_port = COM6

[env:esp32-c3-supermini]
platform = espressif32@6.13.0  ; pinned: newer platforms ship mbedTLS 3 (no _ret functions for the web auth patch)
board = esp32-c3-devkitm-1
framework = arduino
upload_speed = 460800
monitor_speed = 115200
; The C3 Super Mini has no USB-UART chip: Serial (and so the serial command protocol of
; src/serial_cmd.cpp) must be the native USB CDC port.
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCC_MDNS_NAME=\"cccamera\"   ; this flasher sits on the camera (J6); the D1 mini stays cc.local
